name: Windows test package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
      DOCKER_ENABLE_SECURITY: "false"
      JPDFIUM_PLATFORMS: windows-x64
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test desktop backend staging
        run: node --test frontend/editor/scripts/stage-desktop-backend.test.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          workspaces: |
            frontend/editor/src-tauri
            frontend/editor/src-tauri/provisioner
            frontend/editor/src-tauri/thumbnail-handler

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e

      - name: Check backend resources and formatting
        run: task backend:check

      - name: Prepare bundled backend and Java runtime
        run: task desktop:prepare

      - name: Smoke-test bundled backend startup
        run: ./scripts/smoke-bundled-backend.ps1 -RequireDocumentComponents

      - name: Check desktop types
        run: task frontend:typecheck:desktop

      - name: Test native host
        working-directory: frontend/editor/src-tauri
        run: cargo test --locked --lib

      - name: Build EXE installer
        working-directory: frontend/editor
        run: npx tauri build --bundles nsis --config src-tauri/tauri.test-build.conf.json

      - name: Verify desktop asset layout
        run: |
          node scripts/check-desktop-assets.mjs
          if (-not (Test-Path -LiteralPath 'frontend/editor/src-tauri/target/release/LightPage-PDF.exe')) { throw 'Expected the branded application executable' }
          if (Get-ChildItem -LiteralPath frontend/editor/src-tauri/libs -Filter 'stirling-pdf-*.jar' -File) { throw 'Legacy backend filename must not be packaged' }
          foreach ($directory in @('include', 'lib')) {
            if (Test-Path -LiteralPath "frontend/editor/src-tauri/runtime/tools/poppler/Library/$directory") { throw "Poppler SDK directory is bundled: $directory" }
          }

      - name: Build MSI installer
        continue-on-error: true
        working-directory: frontend/editor
        run: npx tauri bundle --verbose --bundles msi --config src-tauri/tauri.test-build.conf.json

      - name: Record artifact checksums
        run: |
          $packages = Get-ChildItem -LiteralPath frontend/editor/src-tauri/target/release/bundle -Recurse -File | Where-Object Extension -In '.exe','.msi'
          if (-not ($packages | Where-Object Extension -EQ '.exe')) { throw "Expected an EXE installer" }
          $packages | ForEach-Object {
            Write-Host "$($_.Name): $($_.Length) bytes"
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content -LiteralPath frontend/editor/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LightPage-PDF-Windows-EXE-${{ github.run_number }}
          path: |
            frontend/editor/src-tauri/target/release/bundle/nsis/*.exe
            frontend/editor/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows MSI installer
        if: ${{ hashFiles('frontend/editor/src-tauri/target/release/bundle/msi/*.msi') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LightPage-PDF-Windows-MSI-${{ github.run_number }}
          path: |
            frontend/editor/src-tauri/target/release/bundle/msi/*.msi
            frontend/editor/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
